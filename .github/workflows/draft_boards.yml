# Weekly snapshot of the NFL draft boards (ESPN, Tankathon) into
# models/draft_boards.csv, the archive the app's draft badges read, so the
# app makes no calls to those sites. Run it by hand from the Actions tab too.
name: Draft boards

on:
  schedule:
    - cron: "17 9 * * 2"  # Tuesdays 09:17 UTC, after the weekend's games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-boards
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas<3" requests
      - run: python tools/build_draft_board.py
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/draft_boards.csv
          git diff --cached --quiet && exit 0
          git commit -m "Draft boards snapshot $(date -u +%F)"
          git push
